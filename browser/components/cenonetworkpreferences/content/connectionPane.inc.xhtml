<!-- Ceno Network Preferences Panel -->

<script src="chrome://browser/content/cenonetworkpreferences/connectionPane.js" />
<html:template id="template-paneConnection">

<vbox id="ouinetCategory"
      class="subcategory"
      hidden="true"
      data-category="paneConnection">
  <html:h1 data-l10n-id="ceno-browser-ouinet-preferences-heading"></html:h1>

  <!-- Keep within #ouinetCategory so this won't appear in search results. -->
  <html:div
    id="network-status-ouinet-area"
    class="network-status-area"
    role="group"
    aria-labelledby="network-status-ouinet-area-label"
  >
    <html:span
      id="network-status-ouinet-area-label"
      class="network-status-label"
      data-l10n-id="ceno-browser-ouinet-preferences-ouinet-connection-status-label"
    ></html:span>
    <html:span class="network-status-result" id="network-status-ouinet"></html:span>
    <html:button
      id="network-status-ouinet-connect-button"
      data-l10n-id="ceno-browser-about-ceno-home-connect-button"
    ></html:button>
    <html:button
      id="network-status-ouinet-cancel-button"
      data-l10n-id="ceno-browser-about-ceno-home-cancel-button"
    ></html:button>
    <html:button
      id="network-status-ouinet-disconnect-button"
      data-l10n-id="ceno-browser-about-ceno-home-disconnect-button"
    ></html:button>
    <html:button
      id="network-status-ouinet-enableloggingandreconnect-button"
      data-l10n-id="ceno-browser-about-ceno-home-enableloggingandreconnect-button"
    ></html:button>
    <html:button
      id="network-status-ouinet-allow-firewall-button"
      data-l10n-id="ceno-browser-about-ceno-home-allow-firewall"
    ></html:button>
  </html:div>

  <html:div
    id="error-container"
    role="group"
    aria-labelledby="error-container-label"
  >
    <html:p id="error-message-link-status-offline" data-l10n-id="ceno-browser-about-ceno-home-link-status-offline"></html:p>
    <html:p id="error-message-firewall" data-l10n-id="ceno-browser-about-ceno-home-error-firewall-blocked"></html:p>
    <html:p id="error-message-failed-to-start" data-l10n-id="ceno-browser-about-ceno-home-error-ouinet-failed-to-start"></html:p>
    <html:p id="error-message-failed-to-start-show-log" data-l10n-id="ceno-browser-about-ceno-home-error-ouinet-failed-to-start-show-log">
      <html:a data-l10n-name="showlogfile" id="showlogfile_err_msg" target="_blank" data-l10n-id="ceno-browser-ouinet-preferences-logging-show-logfile"></html:a>
    </html:p>
    <html:p id="error-message-udp-port-mismatch" data-l10n-id="ceno-browser-about-ceno-home-error-udp-port-mismatch">
      <html:span data-l10n-name="requested"></html:span>
      <html:span data-l10n-name="actual"></html:span>
    </html:p>
  </html:div>

  <html:div>
    <html:span
      data-l10n-id="ceno-browser-ouinet-preferences-reachability"
      class="network-status-label-not-bold"></html:span>
    <html:span class="network-status-result" id="reachability-status">Undecided</html:span>
  </html:div>
  <html:div>
    <html:span class="network-status-label-not-bold">UPnP:</html:span>
    <html:span class="network-status-result" id="upnp-status">Undecided</html:span>
  </html:div>
  <html:div>
    <html:span
      data-l10n-id="ceno-browser-ouinet-preferences-local-udp"
      class="network-status-label-not-bold"></html:span>
    <html:span class="network-status-result" id="local-udp">Unknown</html:span>
  </html:div>
  <html:div>
    <html:span
      data-l10n-id="ceno-browser-ouinet-preferences-public-udp"
      class="network-status-label-not-bold"></html:span>
    <html:span class="network-status-result" id="public-udp">Unknown</html:span>
  </html:div>
</vbox>

<!-- Quickstart -->
<groupbox data-category="paneConnection" hidden="true">
  <label>
    <html:h2 data-l10n-id="ceno-browser-ouinet-preferences-automatic-heading"></html:h2>
  </label>
  <description
    class="description-deemphasized"
    flex="1"
    data-l10n-id="ceno-browser-ouinet-preferences-automatic-description"
  />
  <html:moz-toggle
    id="ouinet-connection-quickstart-toggle"
    class="moz-toggle ouinet-moz-toggle"
    preference="ceno.network.quickstart"
    label-align-after=""
    data-l10n-id="ceno-browser-ouinet-preferences-quickstart-checkbox"
    data-l10n-attrs="label"
  />
</groupbox>

<!-- Headless mode -->
<groupbox data-category="paneConnection" hidden="true">
  <label>
    <html:h2 data-l10n-id="ceno-browser-ouinet-preferences-headless-heading"></html:h2>
  </label>
  <description
    class="description-deemphasized"
    flex="1"
    data-l10n-id="ceno-browser-ouinet-preferences-headless-description"
  />
  <html:moz-toggle
    id="ouinet-connection-headless-toggle"
    class="moz-toggle ouinet-moz-toggle"
    preference="ceno.network.headless"
    label-align-after=""
    data-l10n-id="ceno-browser-ouinet-preferences-headless-checkbox"
    data-l10n-attrs="label"
  />
</groupbox>

<!-- Bridge mode -->
<groupbox data-category="paneConnection" hidden="true">
  <label>
    <html:h2 data-l10n-id="ceno-browser-ouinet-preferences-bridge-heading"></html:h2>
  </label>
  <description
    class="description-deemphasized"
    flex="1"
    data-l10n-id="ceno-browser-ouinet-preferences-bridge-description"
  />
  <html:moz-toggle
    id="ouinet-connection-bridge-toggle"
    class="moz-toggle ouinet-moz-toggle"
    preference="ceno.network.bridge"
    label-align-after=""
    data-l10n-id="ceno-browser-ouinet-preferences-bridge-checkbox"
    data-l10n-attrs="label"
  />
</groupbox>

<!-- UDP mux port -->
<groupbox data-category="paneConnection" hidden="true">
  <label>
    <html:h2 data-l10n-id="ceno-browser-ouinet-preferences-udp-mux-port-heading"></html:h2>
  </label>
  <description
    class="description-deemphasized"
    flex="1"
    data-l10n-id="ceno-browser-ouinet-preferences-udp-mux-port-description"
  />
  <html:moz-toggle
    id="udp-mux-port-random-toggle"
    class="moz-toggle ouinet-moz-toggle"
    preference="ceno.network.udp_mux_port_random"
    label-align-after=""
    data-l10n-id="ceno-browser-ouinet-preferences-udp-mux-port-random-checkbox"
    data-l10n-attrs="label"
  />
  <hbox align="center" id="udp-mux-port-hbox">
    <html:input
      type="number" id="udp-mux-port"
      min="1" max="65535" step="1"
      preference="ceno.network.udp_mux_port"
    />
    <label id="udp-mux-port-label" control="udp-mux-port"
      data-l10n-id="ceno-browser-ouinet-preferences-udp-mux-port" />
  </hbox>
</groupbox>

<vbox class="subcategory content-sources" data-category="paneConnection" hidden="true">
  <label>
    <html:h1
      tabindex="-1"
      data-l10n-id="ceno-browser-ouinet-preferences-sources-heading"
    ></html:h1>
  </label>

  <h4
    id="ouinet-connection-personal-unreachable"
    data-l10n-id="ceno-browser-ouinet-preferences-sources-personal-unreachable"
  ></h4>
  <h4
    id="ouinet-connection-public-unreachable"
    data-l10n-id="ceno-browser-ouinet-preferences-sources-public-unreachable"
  ></h4>
  <html:moz-toggle
    id="ouinet-connection-origin-access"
    preference="ceno.network.origin_access"
    class="moz-toggle ouinet-moz-toggle"
    label-align-after=""
    data-l10n-id="ceno-browser-ouinet-preferences-sources-origin-access"
    data-l10n-attrs="label"
  />
  <html:moz-toggle
    id="ouinet-connection-proxy-access"
    preference="ceno.network.proxy_access"
    class="moz-toggle ouinet-moz-toggle"
    label-align-after=""
    data-l10n-id="ceno-browser-ouinet-preferences-sources-proxy-access"
    data-l10n-attrs="label"
  />
  <html:moz-toggle
    id="ouinet-connection-injector-access"
    preference="ceno.network.injector_access"
    class="moz-toggle ouinet-moz-toggle"
    label-align-after=""
    data-l10n-id="ceno-browser-ouinet-preferences-sources-injector-access"
    data-l10n-attrs="label"
  />
  <html:moz-toggle
    id="ouinet-connection-distributed-cache"
    preference="ceno.network.distributed_cache"
    class="moz-toggle ouinet-moz-toggle"
    label-align-after=""
    data-l10n-id="ceno-browser-ouinet-preferences-sources-distributed-cache"
    data-l10n-attrs="label"
  />
</vbox>

<groupbox data-category="paneConnection" hidden="true">
  <label>
    <html:h2 data-l10n-id="ceno-browser-ouinet-preferences-local-cache"></html:h2>
  </label>

  <html:div
    id="network-status-ouinet-area"
    class="network-status-area"
    role="group"
    aria-labelledby="network-status-ouinet-area-label"
  >
  <html:span
    id="local-cache-size"
    data-l10n-id="ceno-browser-ouinet-preferences-local-cache-size-unknown"
  >
    <html:span data-l10n-name="size"></html:span>
  </html:span>
  <html:button
    id="clear-cache-button"
    data-l10n-id="ceno-browser-ouinet-preferences-local-cache-clear-button"
  ></html:button>
  </html:div>
</groupbox>

<vbox class="subcategory" data-category="paneConnection" hidden="true">
  <label>
    <html:h1
      tabindex="-1"
      data-l10n-id="ceno-browser-ouinet-preferences-logging-heading"
    ></html:h1>
  </label>
  <description
    class="description-deemphasized"
    flex="1"
    data-l10n-id="ceno-browser-ouinet-preferences-logging-description"
  />
  <hbox align="center">
    <menulist id="logging-level" preference="ceno.network.logging_level">
      <menupopup>
        <menuitem data-l10n-id="logging-level-silly" value="silly"/>
        <menuitem data-l10n-id="logging-level-debug" value="debug"/>
        <menuitem data-l10n-id="logging-level-verbose" value="verbose"/>
        <menuitem data-l10n-id="logging-level-info" value="info"/>
        <menuitem data-l10n-id="logging-level-warn" value="warn"/>
        <menuitem data-l10n-id="logging-level-error" value="error"/>
        <menuitem data-l10n-id="logging-level-abort" value="abort"/>
        <menuitem data-l10n-id="logging-level-disabled" value="disabled"/>
      </menupopup>
    </menulist>
    <label id="logging-level-label" control="logging-level"
      data-l10n-id="ceno-browser-ouinet-preferences-logging-level" />
  </hbox>
  <html:a class="showlogfile" id="showlogfile" target="_blank" data-l10n-id="ceno-browser-ouinet-preferences-logging-show-logfile"></html:a>
</vbox>

<groupbox data-category="paneConnection" hidden="true">
  <label>
    <html:h2 data-l10n-id="ceno-browser-ouinet-preferences-metrics-heading"></html:h2>
  </label>
  <description
    class="description-deemphasized"
    flex="1"
    data-l10n-id="ceno-browser-ouinet-preferences-metrics-description"
  />

  <html:moz-toggle
    id="ouinet-metrics"
    class="moz-toggle ouinet-moz-toggle"
    preference="ceno.network.metrics"
    label-align-after=""
    data-l10n-id="ceno-browser-ouinet-preferences-metrics-checkbox"
    data-l10n-attrs="label"
  />
</groupbox>

</html:template>
